<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sin City • C9.0.5 Tests</title>
<style>
body{margin:0;background:#0f1012;color:#f5f5f6;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:minmax(360px,.8fr) minmax(620px,1.6fr);gap:16px;align-items:start}.card{background:#181a1d;border:1px solid #34373d;border-radius:14px;padding:18px}.status{padding:10px 12px;border:1px solid #3b3f46;border-radius:9px;margin:8px 0}.ok{border-color:#2d7a5b}.bad{border-color:#9c414c}.muted{color:#aeb2b9;font-size:13px;line-height:1.45}iframe{width:100%;height:790px;border:1px solid #34373d;border-radius:12px;background:#000}button{margin-bottom:8px}@media(max-width:1050px){.grid{grid-template-columns:1fr}iframe{height:720px}}
</style>
</head>
<body><div class="wrap"><div class="grid">
<section class="card"><h1>C9.0.5 — Movimentação de subcategorias</h1><p class="muted">Runner seguro. Não conecta GitHub e não publica. Move uma subcategoria localmente, valida a estrutura e restaura a ordem original ao final.</p><button id="run">Executar novamente</button><div id="summary" class="status">Aguardando o Studio…</div><div id="results"></div></section>
<section class="card"><iframe id="studio" src="./editor.html" title="Studio C9.0.5"></iframe></section>
</div></div>
<script>
'use strict';
const frame=document.getElementById('studio'),results=document.getElementById('results'),summary=document.getElementById('summary');
function row(ok,title,detail=''){return `<div class="status ${ok?'ok':'bad'}"><strong>${ok?'✓':'✕'} ${title}</strong>${detail?`<div class="muted">${detail}</div>`:''}</div>`}
const categoryCards=d=>[...d.querySelectorAll('#cats > details.item')];
const subcards=(d,ci)=>[...categoryCards(d)[ci]?.querySelectorAll(':scope > .sub-list > details.subitem')||[]];
const subIds=(d,ci)=>subcards(d,ci).map(card=>String(card.dataset.subcategoryId||''));
const subIndexById=(d,ci,id)=>subcards(d,ci).findIndex(card=>String(card.dataset.subcategoryId||'')===String(id||''));
function run(){
 const w=frame.contentWindow,d=frame.contentDocument,checks=[];const add=(ok,title,detail='')=>checks.push({ok:Boolean(ok),title,detail});
 try{
  add(d.readyState==='complete','Studio carregado',d.readyState);
  add(Boolean(w.SinCityOrdering)&&w.SinCityOrdering.version==='C9.0.5','Módulo C9.0.5 carregado',w.SinCityOrdering?.version||'ausente');
  let cats=categoryCards(d);
  add(cats.length>0,'Categorias disponíveis',`${cats.length} categoria(s)`);
  add(typeof w.SinCityOrdering?.moveCategory==='function','Movimentação de categorias preservada','moveCategory disponível');
  add(typeof w.SinCityOrdering?.moveSubcategory==='function','API de subcategorias disponível','moveSubcategory disponível');

  const catControls=cats.map(card=>card.querySelectorAll('[data-c9-move-category]').length);
  add(catControls.every(n=>n===2),'Controles de categoria preservados',catControls.join(', '));

  const allSubs=[...d.querySelectorAll('#cats > details.item .subitem[data-subcategory-number]')];
  add(allSubs.length>0,'Subcategorias disponíveis',`${allSubs.length} subcategoria(s)`);
  const subControlCounts=allSubs.map(card=>card.querySelectorAll('[data-c9-move-subcategory]').length);
  add(subControlCounts.every(n=>n===2),'Controles ↑/↓ em todas as subcategorias',`${subControlCounts.length} subcategoria(s)`);
  const names=[...d.querySelectorAll('[data-c9-move-subcategory]')].map(btn=>btn.getAttribute('aria-label')||'');
  add(names.length>0&&names.every(Boolean),'Controles de subcategoria possuem nomes acessíveis',`${names.length} controle(s)`);
  const ids=allSubs.map(card=>card.dataset.subcategoryId||'').filter(Boolean);
  add(ids.length===allSubs.length&&new Set(ids).size===ids.length,'IDs de subcategorias únicos',`${ids.length}/${allSubs.length}`);
  const idInputs=[...d.querySelectorAll('details.subitem input[data-sub][data-k="id"]')];
  add(idInputs.length===allSubs.length&&idInputs.every(input=>!input.readOnly),'IDs de subcategorias continuam editáveis',`${idInputs.length}/${allSubs.length}`);

  const numbered=allSubs.every(card=>/^\d{2}\.\d{2}$/.test(card.dataset.subcategoryNumber||''));
  add(numbered,'Numeração estrutural das subcategorias válida',allSubs.slice(0,8).map(card=>card.dataset.subcategoryNumber).join(', '));

  let testCi=-1;
  for(let ci=0;ci<cats.length;ci++){if(subcards(d,ci).length>=3){testCi=ci;break;}}
  add(testCi>=0,'Categoria com 3+ subcategorias disponível para teste',testCi>=0?`categoria ${String(testCi+1).padStart(2,'0')}`:'nenhuma encontrada');

  if(testCi>=0){
   let subs=subcards(d,testCi);
   const original=subIds(d,testCi);
   const from=subs.length-1;
   const moving=subs[from];
   const movingId=String(moving.dataset.subcategoryId||'');
   const movingRulesBefore=[...moving.querySelectorAll(':scope > .rule')].map(rule=>rule.textContent.trim()).join('\n');

   const first=w.SinCityOrdering.moveSubcategory(testCi,from,-1,{notify:false});
   const afterFirst=subIndexById(d,testCi,movingId);
   const second=w.SinCityOrdering.moveSubcategory(testCi,afterFirst,-1,{notify:false});
   const afterTwo=subIndexById(d,testCi,movingId);
   add(first?.moved&&second?.moved&&first.id===movingId&&second.id===movingId&&afterTwo===from-2,'Movimentos repetidos de subcategoria funcionam',`posição atual=${afterTwo+1}`);

   subs=subcards(d,testCi);
   const expected=subs.map((_,si)=>`${String(testCi+1).padStart(2,'0')}.${String(si+1).padStart(2,'0')}`);
   const numbers=subs.map(card=>card.dataset.subcategoryNumber||'');
   add(JSON.stringify(numbers)===JSON.stringify(expected),'Subcategorias renumeram automaticamente',numbers.join(', '));

   const moved=subs.find(card=>card.dataset.subcategoryId===movingId);
   const movedRulesAfter=[...moved?.querySelectorAll(':scope > .rule')||[]].map(rule=>rule.textContent.trim()).join('\n');
   add(movingRulesBefore===movedRulesAfter,'Conteúdo/regras acompanham a subcategoria','conteúdo preservado');
   add(String(moved?.dataset.subcategoryId||'')===movingId,'ID interno preservado após movimento',movingId);

   const up=moved?.querySelector('[data-c9-move-subcategory="up"]');
   const down=moved?.querySelector('[data-c9-move-subcategory="down"]');
   add(Number(up?.dataset.categoryIndex)===testCi&&Number(up?.dataset.subcategoryIndex)===afterTwo&&Number(down?.dataset.subcategoryIndex)===afterTwo,'Índices dos controles atualizados após movimento',`categoria=${testCi}, subcategoria=${afterTwo}`);

   const firstSub=subcards(d,testCi)[0],lastSub=subcards(d,testCi).at(-1);
   add(Boolean(firstSub?.querySelector('[data-c9-move-subcategory="up"]')?.disabled),'Limite superior da subcategoria protegido','↑ da primeira desabilitado');
   add(Boolean(lastSub?.querySelector('[data-c9-move-subcategory="down"]')?.disabled),'Limite inferior da subcategoria protegido','↓ da última desabilitado');

   const back1Index=subIndexById(d,testCi,movingId);
   const back1=w.SinCityOrdering.moveSubcategory(testCi,back1Index,1,{notify:false});
   const back2Index=subIndexById(d,testCi,movingId);
   const back2=w.SinCityOrdering.moveSubcategory(testCi,back2Index,1,{notify:false});
   const restored=subIds(d,testCi);
   add(back1?.moved&&back2?.moved&&JSON.stringify(restored)===JSON.stringify(original),'Movimento inverso restaura ordem original',JSON.stringify(restored)===JSON.stringify(original)?'ordem=ok':'ordem=diferente');
  }else{
   ['Movimentos repetidos de subcategoria funcionam','Subcategorias renumeram automaticamente','Conteúdo/regras acompanham a subcategoria','ID interno preservado após movimento','Índices dos controles atualizados após movimento','Limite superior da subcategoria protegido','Limite inferior da subcategoria protegido','Movimento inverso restaura ordem original'].forEach(title=>add(true,title,'não aplicável'));
  }

  add(typeof w.sendPreview==='function'&&typeof w.publish==='function','Prévia e publicação preservadas','funções existentes; publicação não executada');
 }catch(error){add(false,'Runner executado sem exceções',error.message||String(error));}
 const passed=checks.filter(x=>x.ok).length;results.innerHTML=checks.map(x=>row(x.ok,x.title,x.detail)).join('');summary.className='status '+(passed===checks.length?'ok':'bad');summary.textContent=`${passed}/${checks.length} aprovados`;
}
frame.addEventListener('load',()=>setTimeout(run,1400));document.getElementById('run').addEventListener('click',run);
</script></body></html>
