<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sin City • C10.0.9 Runner Consolidado Final</title>
<style>
body{margin:0;background:#0f1012;color:#f5f5f6;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.wrap{max-width:1540px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:minmax(430px,.95fr) minmax(650px,1.5fr);gap:16px;align-items:start}.card{background:#181a1d;border:1px solid #34373d;border-radius:14px;padding:18px}.status{padding:10px 12px;border:1px solid #3b3f46;border-radius:9px;margin:8px 0}.ok{border-color:#2d7a5b}.bad{border-color:#9c414c}.running{border-color:#8a7442}.muted{color:#aeb2b9;font-size:13px;line-height:1.45}.suite-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.suite-detail{margin-top:6px}.failure{margin-top:7px;padding:7px 9px;border-left:2px solid #9c414c;background:#211518;font-size:12px}.totals{font-size:18px;font-weight:800}.progress{height:8px;background:#282b30;border-radius:999px;overflow:hidden;margin:10px 0 14px}.progress>span{display:block;height:100%;width:0;background:currentColor;transition:width .25s ease}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{padding:9px 13px;border:1px solid #3b3f46;border-radius:8px;background:#22252a;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}iframe{width:100%;height:860px;border:1px solid #34373d;border-radius:12px;background:#000}.current{font-size:12px;color:#c8ccd2;margin-bottom:8px}@media(max-width:1050px){.grid{grid-template-columns:1fr}iframe{height:760px}}@media(prefers-reduced-motion:reduce){.progress>span{transition:none}}
</style>
</head>
<body><div class="wrap"><div class="grid">
<section class="card">
<h1>C10.0.9 — Runner consolidado final</h1>
<p class="muted">Executa, em sequência e de forma isolada, todas as baterias da C10.0.2 até C10.0.8. Cada suíte restaura os próprios dados e não autentica nem publica no GitHub.</p>
<div class="actions"><button id="run">Executar bateria completa</button></div>
<div id="summary" class="status">Aguardando execução…</div>
<div class="progress" aria-hidden="true"><span id="bar"></span></div>
<div id="results"></div>
</section>
<section class="card"><div id="current" class="current">Nenhuma suíte em execução.</div><iframe id="runner" src="about:blank" title="Suíte C10 em execução"></iframe></section>
</div></div>
<script>
'use strict';
const SUITES=[
 {id:'C10.0.2',file:'./c10-0-2-tests.html',name:'Motor genérico e APIs absolutas'},
 {id:'C10.0.3',file:'./c10-0-3-tests.html',name:'Drag-and-drop de categorias'},
 {id:'C10.0.4',file:'./c10-0-4-tests.html',name:'Drag-and-drop de subcategorias'},
 {id:'C10.0.5',file:'./c10-0-5-tests.html',name:'Drag-and-drop de regras'},
 {id:'C10.0.6',file:'./c10-0-6-tests.html',name:'Estado visual, preview e imagens'},
 {id:'C10.0.7',file:'./c10-0-7-tests.html',name:'Acessibilidade e fallback responsivo'},
 {id:'C10.0.8',file:'./c10-0-8-tests.html',name:'Persistência e regressões C9'}
];
const runner=document.getElementById('runner'),runBtn=document.getElementById('run'),summary=document.getElementById('summary'),results=document.getElementById('results'),current=document.getElementById('current'),bar=document.getElementById('bar');
const wait=(ms=100)=>new Promise(r=>setTimeout(r,ms));
let running=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function suiteMarkup(result){
 const cls=result.ok?'ok':'bad';
 const failures=(result.failures||[]).map(text=>`<div class="failure">${esc(text)}</div>`).join('');
 return `<div class="status ${cls}"><div class="suite-title"><strong>${result.ok?'✓':'✕'} ${esc(result.id)} — ${esc(result.name)}</strong><span>${result.passed}/${result.total}</span></div><div class="muted suite-detail">${esc(result.detail||'')}</div>${failures}</div>`;
}
function parseSummary(text){const m=String(text||'').trim().match(/^(\d+)\/(\d+) aprovados$/);return m?{passed:+m[1],total:+m[2],ok:m[1]===m[2]}:null}
function collectFailures(doc){return [...doc.querySelectorAll('#results .bad')].map(el=>String(el.textContent||'').replace(/\s+/g,' ').trim()).filter(Boolean).slice(0,12)}
async function runSuite(suite,index){
 current.textContent=`Executando ${suite.id} — ${suite.name}`;
 bar.style.width=`${Math.round(index/SUITES.length*100)}%`;
 const stamp=Date.now()+'-'+index;
 runner.src=suite.file+'?c10final='+stamp;
 let loaded=false;
 for(let i=0;i<420;i++){
  await wait(100);
  try{
   const doc=runner.contentDocument;
   if(!doc)continue;
   const text=String(doc.getElementById('summary')?.textContent||'').trim();
   const parsed=parseSummary(text);
   if(parsed){
    loaded=true;
    return {...suite,...parsed,detail:text,failures:parsed.ok?[]:collectFailures(doc)};
   }
   const bad=doc.querySelector('#results .bad');
   if(bad&&/Runner executado sem exceções/i.test(bad.textContent||'')){
    return {...suite,passed:0,total:1,ok:false,detail:'A suíte encerrou com exceção antes de gerar o resumo.',failures:collectFailures(doc)};
   }
  }catch{}
 }
 return {...suite,passed:0,total:1,ok:false,detail:loaded?'Resumo inválido.':'Tempo esgotado aguardando a suíte.',failures:[]};
}
async function runAll(){
 if(running)return;
 running=true;runBtn.disabled=true;results.innerHTML='';bar.style.width='0%';summary.className='status running';summary.textContent='Executando bateria completa…';
 const outcomes=[];
 for(let i=0;i<SUITES.length;i++){
  const outcome=await runSuite(SUITES[i],i);
  outcomes.push(outcome);
  results.insertAdjacentHTML('beforeend',suiteMarkup(outcome));
  const passedSuites=outcomes.filter(x=>x.ok).length;
  const passedTests=outcomes.reduce((n,x)=>n+x.passed,0);
  const totalTests=outcomes.reduce((n,x)=>n+x.total,0);
  summary.textContent=`${passedSuites}/${SUITES.length} suítes concluídas sem falhas · ${passedTests}/${totalTests} testes aprovados até agora`;
 }
 bar.style.width='100%';
 const suitePass=outcomes.filter(x=>x.ok).length,totalPassed=outcomes.reduce((n,x)=>n+x.passed,0),totalTests=outcomes.reduce((n,x)=>n+x.total,0);
 const allOk=suitePass===SUITES.length&&totalPassed===totalTests;
 summary.className='status '+(allOk?'ok':'bad');
 summary.innerHTML=`<div class="totals">${allOk?'✓ C10 APROVADA NO RUNNER':'✕ C10 COM FALHAS NO RUNNER'}</div><div class="muted">${suitePass}/${SUITES.length} suítes aprovadas · ${totalPassed}/${totalTests} testes individuais aprovados.</div>`;
 current.textContent=allOk?'Bateria consolidada concluída sem falhas.':'Bateria concluída com falhas; veja o resumo à esquerda.';
 runner.src='about:blank';
 runBtn.disabled=false;running=false;
}
runBtn.addEventListener('click',runAll);
setTimeout(runAll,450);
</script></body></html>
