<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sin City • C10 Runner Final</title><style>body{margin:0;background:#0f1012;color:#f5f5f6;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.wrap{max-width:1540px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:minmax(430px,.95fr) minmax(650px,1.5fr);gap:16px}.card{background:#181a1d;border:1px solid #34373d;border-radius:14px;padding:18px}.status{padding:10px 12px;border:1px solid #3b3f46;border-radius:9px;margin:8px 0}.ok{border-color:#2d7a5b}.bad{border-color:#9c414c}.running{border-color:#8a7442}.muted{color:#aeb2b9;font-size:13px;line-height:1.45}.failure{margin-top:7px;padding:7px 9px;border-left:2px solid #9c414c;background:#211518;font-size:12px}.totals{font-size:18px;font-weight:800}.progress{height:8px;background:#282b30;border-radius:999px;overflow:hidden;margin:10px 0 14px}.progress>span{display:block;height:100%;width:0;background:currentColor}.suite-title{display:flex;justify-content:space-between;gap:10px}button{padding:9px 13px;border:1px solid #3b3f46;border-radius:8px;background:#22252a;color:#fff;font-weight:700;cursor:pointer}iframe{width:100%;height:860px;border:1px solid #34373d;border-radius:12px;background:#000}@media(max-width:1050px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="grid"><section class="card"><h1>C10 — Runner consolidado final</h1><p class="muted">Versão simplificada e estável: organização exclusivamente por ↑ Subir / ↓ Descer. Não há drag-and-drop. Executa motor, fluxo real com imagens e persistência/regressões C9.</p><button id="run">Executar bateria completa</button><div id="summary" class="status">Aguardando execução…</div><div class="progress"><span id="bar"></span></div><div id="results"></div></section><section class="card"><div id="current" class="muted">Nenhuma suíte em execução.</div><iframe id="runner" src="about:blank" title="Suíte C10"></iframe></section></div></div><script>'use strict';const SUITES=[{id:'C10.MOTOR',file:'./c10-0-2-tests.html',name:'Motor de reordenação'},{id:'C10.BOTOES',file:'./c10-buttons-only-tests.html',name:'↑/↓ + imagem + ausência de drag'},{id:'C10.PERSISTENCIA',file:'./c10-0-8-tests.html',name:'Rascunho, backup, publicação e regressões C9'}];const runner=document.getElementById('runner'),runBtn=document.getElementById('run'),summary=document.getElementById('summary'),results=document.getElementById('results'),current=document.getElementById('current'),bar=document.getElementById('bar');const wait=(ms=100)=>new Promise(r=>setTimeout(r,ms));let running=false;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function parse(text){const m=String(text||'').trim().match(/^(\d+)\/(\d+) aprovados$/);return m?{passed:+m[1],total:+m[2],ok:m[1]===m[2]}:null}function failures(doc){return [...doc.querySelectorAll('#results .bad')].map(el=>String(el.textContent||'').replace(/\s+/g,' ').trim()).filter(Boolean).slice(0,10)}function markup(r){return `<div class="status ${r.ok?'ok':'bad'}"><div class="suite-title"><strong>${r.ok?'✓':'✕'} ${esc(r.id)} — ${esc(r.name)}</strong><span>${r.passed}/${r.total}</span></div>${(r.failures||[]).map(x=>`<div class="failure">${esc(x)}</div>`).join('')}</div>`}async function runSuite(s,i){current.textContent=`Executando ${s.id} — ${s.name}`;bar.style.width=`${Math.round(i/SUITES.length*100)}%`;runner.src=s.file+'?final='+Date.now()+'-'+i;for(let n=0;n<420;n++){await wait(100);try{const doc=runner.contentDocument;if(!doc)continue;const p=parse(doc.getElementById('summary')?.textContent);if(p)return{...s,...p,failures:p.ok?[]:failures(doc)}}catch{}}return{...s,passed:0,total:1,ok:false,failures:['Tempo esgotado aguardando a suíte.']}}async function runAll(){if(running)return;running=true;runBtn.disabled=true;results.innerHTML='';summary.className='status running';summary.textContent='Executando bateria…';const out=[];for(let i=0;i<SUITES.length;i++){const r=await runSuite(SUITES[i],i);out.push(r);results.insertAdjacentHTML('beforeend',markup(r))}bar.style.width='100%';const passed=out.filter(x=>x.ok).length,totalPassed=out.reduce((n,x)=>n+x.passed,0),total=out.reduce((n,x)=>n+x.total,0),ok=passed===SUITES.length&&totalPassed===total;summary.className='status '+(ok?'ok':'bad');summary.innerHTML=`<div class="totals">${ok?'✓ C10 ESTÁVEL APROVADA NO RUNNER':'✕ C10 COM FALHAS NO RUNNER'}</div><div class="muted">${passed}/${SUITES.length} suítes · ${totalPassed}/${total} testes aprovados.</div>`;current.textContent=ok?'Bateria concluída sem falhas.':'Bateria concluída com falhas.';runner.src='about:blank';runBtn.disabled=false;running=false}runBtn.onclick=runAll;setTimeout(runAll,450);</script></body></html>
