<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sin City • C10.0.5 Drag de Regras</title>
<style>
body{margin:0;background:#0f1012;color:#f5f5f6;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:minmax(390px,.9fr) minmax(650px,1.5fr);gap:16px;align-items:start}.card{background:#181a1d;border:1px solid #34373d;border-radius:14px;padding:18px}.status{padding:10px 12px;border:1px solid #3b3f46;border-radius:9px;margin:8px 0}.ok{border-color:#2d7a5b}.bad{border-color:#9c414c}.muted{color:#aeb2b9;font-size:13px;line-height:1.45}.group{margin:15px 0 7px;font-size:12px;letter-spacing:.08em;color:#c9cdd3;text-transform:uppercase}iframe{width:100%;height:840px;border:1px solid #34373d;border-radius:12px;background:#000}button{margin-bottom:8px}@media(max-width:1050px){.grid{grid-template-columns:1fr}iframe{height:720px}}
</style>
</head>
<body><div class="wrap"><div class="grid">
<section class="card"><h1>C10.0.5 — Drag de regras</h1><p class="muted">Valida handles, isolamento por bloco e movimentação de regras diretas/aninhadas. Não conecta GitHub, não publica e restaura os dados originais.</p><button id="run">Executar novamente</button><div id="summary" class="status">Aguardando o Studio…</div><div id="results"></div></section>
<section class="card"><iframe id="studio" src="./editor.html" title="Studio C10.0.5"></iframe></section>
</div></div>
<script>
'use strict';
const frame=document.getElementById('studio'),results=document.getElementById('results'),summary=document.getElementById('summary');
const wait=(ms=110)=>new Promise(r=>setTimeout(r,ms));
function row(ok,title,detail=''){return `<div class="status ${ok?'ok':'bad'}"><strong>${ok?'✓':'✕'} ${title}</strong>${detail?`<div class="muted">${detail}</div>`:''}</div>`}
function group(title){return `<div class="group">${title}</div>`}
async function ready(w){for(let i=0;i<100;i++){if(w.SinCityRuleDrag?.version==='C10.0.5'&&w.SinCityReorderEngine&&w.document.querySelector('#cats > details.item'))return true;await wait(75)}return false}
async function run(){
 const w=frame.contentWindow,checks=[];let section='';
 const add=(ok,title,detail='')=>checks.push({section,ok:Boolean(ok),title,detail});
 try{
  const loaded=await ready(w);section='01 · Carregamento';
  add(loaded,'Studio e módulo C10.0.5 carregados',loaded?'pronto':'tempo esgotado');
  const d=w.SinCityRuleDrag,e=w.SinCityReorderEngine,data=e?.getData?.();
  add(d?.version==='C10.0.5','Módulo de drag de regras disponível',d?.version||'ausente');
  add(typeof d?.computeDropIndex==='function'&&typeof d?.sameContainer==='function','Helpers de drop disponíveis');
  add(Boolean(data&&Array.isArray(data.categories)),'Dados do Studio acessíveis pelo motor');

  section='02 · Handles';
  d.refresh();await wait();
  const ruleCards=[...w.document.querySelectorAll('#cats .rule')];
  const handles=[...w.document.querySelectorAll('.c10-rule-drag-handle')];
  add(ruleCards.length>0,'Há regras renderizadas',String(ruleCards.length));
  add(handles.length===ruleCards.length,'Cada regra possui um handle de arraste',`${handles.length}/${ruleCards.length}`);
  add(handles.every(h=>h.draggable&&h.getAttribute('aria-label')&&h.getAttribute('aria-grabbed')==='false'),'Handles têm drag e nomes acessíveis');

  section='03 · Isolamento de blocos';
  const direct={scope:'direct',containerKey:'D:cat-a'};
  const directSame={scope:'direct',containerKey:'D:cat-a'};
  const directOther={scope:'direct',containerKey:'D:cat-b'};
  const nested={scope:'nested',containerKey:'S:cat-a:sub-a'};
  add(d.sameContainer(direct,directSame),'Mesmo bloco direto é aceito');
  add(!d.sameContainer(direct,directOther),'Categorias diretas diferentes são bloqueadas');
  add(!d.sameContainer(direct,nested),'Regra direta não cruza com regra de subcategoria');
  add(!d.sameContainer(nested,{scope:'nested',containerKey:'S:cat-a:sub-b'}),'Subcategorias diferentes são bloqueadas');
  add(d.computeDropIndex(0,2,'after',4)===2,'Cálculo de destino considera remoção da origem','0 → depois de 2 = 2');
  add(d.computeDropIndex(3,0,'before',4)===0,'Cálculo suporta mover para o início','3 → 0');

  const original=JSON.stringify(data);
  section='04 · Regra direta';
  const dci=data.categories.findIndex(c=>Array.isArray(c.rules)&&c.rules.length>1);
  if(dci>=0){
   const list=data.categories[dci].rules,first=list[0],code=String(first.code||''),last=list.length-1;
   const result=e.moveDirectRuleTo(dci,0,last,{notify:false,preview:false});await wait();
   add(result.moved,'Regra direta move dentro da categoria',`0 → ${last}`);
   add(list[last]===first,'Objeto da regra direta é preservado');
   add(String(list[last].code||'')===code,'Código manual permanece intacto',code||'(vazio)');
   e.moveDirectRuleTo(dci,last,0,{notify:false,preview:false});await wait();
   add(list[0]===first,'Regra direta retorna à posição original');
  }else add(true,'Teste de regra direta não aplicável','nenhuma categoria com 2+ regras diretas');

  section='05 · Regra de subcategoria';
  let found=null;for(let ci=0;ci<data.categories.length&&!found;ci++){for(let si=0;si<(data.categories[ci].subcategories||[]).length;si++){if((data.categories[ci].subcategories[si].rules||[]).length>1){found=[ci,si];break}}}
  if(found){
   const [ci,si]=found,list=data.categories[ci].subcategories[si].rules,first=list[0],last=list.length-1;
   const expected=w.SinCityOrdering.subcategoryNumber(ci,si);
   const result=e.moveNestedRuleTo(ci,si,0,last,{notify:false,preview:false});await wait();
   add(result.moved,'Regra aninhada move dentro da própria subcategoria',`0 → ${last}`);
   add(list[last]===first,'Objeto da regra aninhada é preservado');
   add(String(list[last].code||'')===expected,'Código automático permanece ligado à subcategoria',expected);
   e.moveNestedRuleTo(ci,si,last,0,{notify:false,preview:false});await wait();
   add(list[0]===first,'Regra aninhada retorna à posição original');
  }else add(true,'Teste de regra aninhada não aplicável','nenhuma subcategoria com 2+ regras');

  section='06 · Regeneração e regressão';
  d.refresh();await wait();
  const handlesAfter=[...w.document.querySelectorAll('.c10-rule-drag-handle')];
  add(handlesAfter.length===w.document.querySelectorAll('#cats .rule').length,'Handles permanecem consistentes após re-render');
  w.SinCityFlowGuard?.flush?.();await wait();
  add(JSON.stringify(data)===original,'Estado dos dados restaurado exatamente');
  add(!w.sessionStorage.getItem('sin-city-gh-token'),'Runner não cria sessão GitHub');
 }catch(error){checks.push({section:section||'Erro',ok:false,title:'Runner executado sem exceções',detail:error?.message||String(error)});}
 let html='',last='';for(const c of checks){if(c.section!==last){last=c.section;html+=group(last)}html+=row(c.ok,c.title,c.detail)}results.innerHTML=html;
 const passed=checks.filter(x=>x.ok).length;summary.className='status '+(passed===checks.length?'ok':'bad');summary.textContent=`${passed}/${checks.length} aprovados`;
}
frame.addEventListener('load',()=>setTimeout(run,2300));document.getElementById('run').addEventListener('click',run);
</script></body></html>
