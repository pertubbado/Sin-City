<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sin City • C10.0.6</title><style>body{margin:0;background:#0f1012;color:#f5f5f6;font-family:system-ui}.wrap{max-width:1500px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:minmax(390px,.9fr) minmax(650px,1.5fr);gap:16px}.card{background:#181a1d;border:1px solid #34373d;border-radius:14px;padding:18px}.status{padding:10px 12px;border:1px solid #3b3f46;border-radius:9px;margin:8px 0}.ok{border-color:#2d7a5b}.bad{border-color:#9c414c}.muted{color:#aeb2b9;font-size:13px}.group{margin:15px 0 7px;font-size:12px;letter-spacing:.08em;color:#c9cdd3;text-transform:uppercase}iframe{width:100%;height:840px;border:1px solid #34373d;border-radius:12px;background:#000}@media(max-width:1050px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="grid"><section class="card"><h1>C10.0.6 — Estado visual, preview e imagens</h1><p class="muted">Não publica, não autentica e restaura a ordem original.</p><button id="run">Executar novamente</button><div id="summary" class="status">Aguardando…</div><div id="results"></div></section><section class="card"><iframe id="studio" src="./editor.html" title="Studio C10.0.6"></iframe></section></div></div><script>
'use strict';const frame=document.getElementById('studio'),results=document.getElementById('results'),summary=document.getElementById('summary');const wait=(ms=100)=>new Promise(r=>setTimeout(r,ms));
function row(ok,t,d=''){return `<div class="status ${ok?'ok':'bad'}"><strong>${ok?'✓':'✕'} ${t}</strong>${d?`<div class="muted">${d}</div>`:''}</div>`}function group(t){return `<div class="group">${t}</div>`}
async function ready(w){for(let i=0;i<100;i++){if(w.SinCityReorderEngine?.integrationVersion==='C10.0.6'&&w.SinCityVisualState?.version==='C10.0.6'&&w.SinCityRuleImages&&w.document.querySelector('#cats>details.item'))return true;await wait(70)}return false}
async function run(){const w=frame.contentWindow,checks=[];let section='';const add=(ok,t,d='')=>checks.push({section,ok:Boolean(ok),title:t,detail:d});try{const loaded=await ready(w);section='01 · Carregamento';add(loaded,'Integração C10.0.6 carregada');const e=w.SinCityReorderEngine,v=w.SinCityVisualState,img=w.SinCityRuleImages,data=e.getData();add(e.version==='C10.0.2'&&e.integrationVersion==='C10.0.6','API do motor preserva compatibilidade');add(typeof v.snapshot==='function'&&typeof v.restore==='function','Camada de estado visual disponível');add(typeof img.refreshBindings==='function'&&typeof img.imageBindingSnapshot==='function','Ponte segura de imagens disponível');
section='02 · Estado aberto e destaque';const cats=[...w.document.querySelectorAll('#cats>details.item')];if(cats.length>1){const first=cats[0],id=first.dataset.categoryId;first.open=true;const sub=first.querySelector(':scope>.sub-list>details.subitem');if(sub)sub.open=true;const to=cats.length-1;const r=e.moveCategoryTo(0,to,{notify:false,preview:false});await wait(180);const moved=[...w.document.querySelectorAll('#cats>details.item')].find(c=>c.dataset.categoryId===id);add(r.moved&&moved?.open,'Categoria aberta permanece aberta após re-render');if(sub){const sid=sub.dataset.subcategoryId;const restoredSub=[...moved.querySelectorAll(':scope>.sub-list>details.subitem')].find(s=>s.dataset.subcategoryId===sid);add(restoredSub?.open,'Subcategoria aberta permanece aberta');}add(moved?.classList.contains('c10-moved-highlight'),'Item movido recebe destaque visual');e.moveCategoryTo(to,0,{notify:false,preview:false});await wait(180);}else add(false,'Há categorias suficientes para testar');
section='03 · Preview imediato';let previewCalls=0;const originalPreview=w.sendPreview;w.sendPreview=function(){previewCalls++;return originalPreview.apply(this,arguments)};if(data.categories.length>1){e.moveCategoryTo(0,1,{notify:false,preview:true});await wait(120);e.moveCategoryTo(1,0,{notify:false,preview:false});await wait(120);add(previewCalls>=1,'Movimentação dispara preview imediatamente',String(previewCalls));}else add(false,'Há categorias suficientes para preview');w.sendPreview=originalPreview;
section='04 · Imagens ligadas à mesma regra';const before=img.imageBindingSnapshot();let candidate=null;for(const item of before){if(item.images?.length){candidate=item;break}}if(!candidate&&before.length)candidate=before[0];if(candidate){const ref=candidate.rule,images=JSON.stringify(candidate.images||[]);let moved=false;if(candidate.key.startsWith('D:')){const [,ci,ri]=candidate.key.split(':').map(Number);const list=data.categories[ci].rules;if(list.length>1){const to=ri===0?1:0;e.moveDirectRuleTo(ci,ri,to,{notify:false,preview:false});await wait(150);const after=img.imageBindingSnapshot().find(x=>x.rule===ref);add(Boolean(after),'Mesmo objeto-regra reencontrado após reordenação');add(JSON.stringify(after?.images||[])===images,'Lista de imagens permanece na mesma regra');add(after?.key!==candidate.key,'Chave visual de posição é recalculada',`${candidate.key} → ${after?.key||'?'}`);e.moveDirectRuleTo(ci,to,ri,{notify:false,preview:false});moved=true;}}else{const [,ci,si,ri]=candidate.key.split(':').map(Number);const list=data.categories[ci].subcategories[si].rules;if(list.length>1){const to=ri===0?1:0;e.moveNestedRuleTo(ci,si,ri,to,{notify:false,preview:false});await wait(150);const after=img.imageBindingSnapshot().find(x=>x.rule===ref);add(Boolean(after),'Mesmo objeto-regra reencontrado após reordenação');add(JSON.stringify(after?.images||[])===images,'Lista de imagens permanece na mesma regra');add(after?.key!==candidate.key,'Chave visual de posição é recalculada',`${candidate.key} → ${after?.key||'?'}`);e.moveNestedRuleTo(ci,si,to,ri,{notify:false,preview:false});moved=true;}}if(!moved)add(true,'Teste de movimento de regra não aplicável','regra candidata sem vizinha no mesmo bloco');}else add(true,'Nenhuma regra disponível para teste de imagens');
section='05 · Segurança';add(!w.sessionStorage.getItem('sin-city-gh-token'),'Runner não cria sessão GitHub');add(!w.document.documentElement.hasAttribute('data-c10-rule-dragging'),'Nenhum estado de drag fica preso');}catch(error){checks.push({section:section||'Erro',ok:false,title:'Runner executado sem exceções',detail:error?.message||String(error)})}let html='',last='';for(const c of checks){if(c.section!==last){last=c.section;html+=group(last)}html+=row(c.ok,c.title,c.detail)}results.innerHTML=html;const passed=checks.filter(x=>x.ok).length;summary.className='status '+(passed===checks.length?'ok':'bad');summary.textContent=`${passed}/${checks.length} aprovados`}
frame.addEventListener('load',()=>setTimeout(run,2400));document.getElementById('run').onclick=run;</script></body></html>
